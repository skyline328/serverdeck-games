name: Katalog

# Prüft Vorlagen bei Pull Requests. Auf main wird catalog.json bei Bedarf neu erzeugt und committet,
# damit auch Änderungen direkt im GitHub-Editor sofort im Panel ankommen.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prüfen
        if: github.event_name == 'pull_request'
        run: npm run check
      - name: catalog.json aktualisieren
        if: github.event_name == 'push'
        run: |
          npm run build
          if ! git diff --quiet catalog.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add catalog.json
            git commit -m "catalog.json aktualisiert"
            git push
          fi
