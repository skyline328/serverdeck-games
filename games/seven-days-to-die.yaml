# 7 Days to Die – Dedicated Server über SteamCMD.
# Zeigt: SteamCMD mit Beta-Zweig, eigene Konfigurationsdatei, die Updates nicht überschreiben.
id: seven-days-to-die
version: 2
name: 7 Days to Die
short: 7D
hue: 15
description: Dedizierter Server über SteamCMD (rund 15 GB). Einstellungen im Bereich „Konfiguration“ des Servers.
beta: true

runtime: base
install:
  steamcmd:
    app: 294420
    beta: "{{var.BRANCH}}"
  script: |
    # Eigene Konfiguration einmalig anlegen – Updates überschreiben nur serverconfig.xml
    [ -f serverdeck.xml ] || cp serverconfig.xml serverdeck.xml
# Port aus Serverdeck in die Konfiguration übernehmen, dann den Server starten
start: >-
  sed -i -E 's|(name="ServerPort"[[:space:]]+value=")[0-9]+|\1{{port.game}}|' serverdeck.xml &&
  exec env LD_LIBRARY_PATH=. ./7DaysToDieServer.x86_64 -configfile=serverdeck.xml -logfile /dev/stdout
  -quit -batchmode -nographics -dedicated
stopTimeoutSec: 60
doneRegex: 'GameServer.LogOn successful'
query:
  type: a2s
  port: game

resources:
  minMemoryMb: 8192
  defaultMemoryMb: 12288
  defaultCpuPercent: 400

ports:
  - name: game
    label: Spiel-Port
    container: 26900
    protocol: tcp+udp
    default: 26900
    matchHost: true
  - name: game2
    label: Spiel-Port + 1
    container: 26901
    protocol: udp
    default: 26901
    matchHost: true
  - name: game3
    label: Spiel-Port + 2
    container: 26902
    protocol: udp
    default: 26902
    matchHost: true

variables:
  - key: BRANCH
    label: Version
    type: select
    default: public
    options:
      - { value: public, label: Stabil }
      - { value: latest_experimental, label: Experimentell }

# Bereich „Konfiguration“ (ab Serverdeck 0.7). Weitere Einträge der Datei erscheinen automatisch,
# mit der Erklärung aus dem Kommentar in der Datei.
configs:
  - file: serverdeck.xml
    label: Server-Einstellungen
    help: Entsteht bei der ersten Installation. Änderungen wirken nach einem Neustart.
    fields:
      ServerName: { label: Name in der Serverliste, group: Allgemein }
      ServerDescription: { label: Beschreibung, group: Allgemein }
      ServerWebsiteURL: { label: Webseite, group: Allgemein }
      ServerPassword: { label: Passwort zum Beitreten, type: secret, help: Leer = ohne Passwort., group: Zugang }
      ServerMaxPlayerCount: { label: Max. Spieler, group: Allgemein, min: 1 }
      ServerVisibility:
        label: Sichtbarkeit
        group: Zugang
        type: select
        options:
          - { value: "2", label: Öffentlich }
          - { value: "1", label: Nur Freunde }
          - { value: "0", label: Nicht gelistet }
      EACEnabled: { label: EasyAntiCheat, group: Zugang }
      GameWorld: { label: Welt, help: "Navezgane oder RWG (zufällig erzeugt). Neue Welt nur bei neuem Spielnamen.", group: Welt }
      WorldGenSeed: { label: Seed (nur RWG), group: Welt }
      WorldGenSize: { label: Weltgröße (nur RWG), help: z. B. 6144, 8192 oder 10240., group: Welt }
      GameName: { label: Spielname (Spielstand), help: Ein neuer Name startet ein neues Spiel., group: Welt }
      GameDifficulty:
        label: Schwierigkeit
        group: Spiel
        type: select
        options:
          - { value: "0", label: Scavenger (leichteste) }
          - { value: "1", label: Adventurer }
          - { value: "2", label: Nomad }
          - { value: "3", label: Warrior }
          - { value: "4", label: Survivalist }
          - { value: "5", label: Insane (schwerste) }
      DayNightLength: { label: Länge eines Tages (Minuten), group: Spiel, min: 10 }
      DayLightLength: { label: Davon Tageslicht (Stunden im Spiel), group: Spiel, min: 0, max: 24 }
      BloodMoonFrequency: { label: Blutmond alle … Tage, help: 0 = nie., group: Spiel, min: 0 }
      LootAbundance: { label: Beute-Menge (%), group: Spiel }
      LootRespawnDays: { label: Beute erneuert nach … Tagen, group: Spiel }
      PlayerKillingMode:
        label: PvP
        group: Spiel
        type: select
        options:
          - { value: "0", label: Kein PvP }
          - { value: "1", label: Nur Verbündete }
          - { value: "2", label: Nur Fremde }
          - { value: "3", label: Alle }
      ServerPort: { readOnly: "Der Port wird von Serverdeck bei jedem Start eingetragen." }
